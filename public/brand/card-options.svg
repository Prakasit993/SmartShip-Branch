<svg viewBox="0 0 1240 920" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1240" height="920" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="620" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#22d3ee" letter-spacing="3">// CARD SYSTEM OPTIONS</text>
  <text x="620" y="62" text-anchor="middle" font-size="11" fill="#71717a">ใช้ทุกหน้า (home, product, contact, warranty)</text>

  <!-- ==================== A · Cyber Lab (matches FAQ) ==================== -->
  <g transform="translate(40 110)">
    <text x="0" y="-12" font-size="14" font-weight="800" fill="#22d3ee">A · CYBER LAB</text>
    <text x="0" y="6" font-size="10" fill="#a1a1aa">tech / lab / brackets · matches new FAQ</text>

    <!-- 3 demo cards -->
    <g transform="translate(0 24)">
      <!-- Card 1 (default) -->
      <rect x="0" y="0" width="240" height="160" rx="14" fill="#0a0a0a" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="30" font-family="ui-monospace, monospace" font-size="36" font-weight="900" fill="#27272a" letter-spacing="-1">01</text>
      <text x="62" y="22" font-family="ui-monospace, monospace" font-size="7" fill="#22d3ee" letter-spacing="1.5">NYXEL // CARD</text>
      <text x="14" y="58" font-size="13" font-weight="700" fill="#f4f4f5">Header text</text>
      <line x1="14" y1="68" x2="44" y2="68" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
      <text x="14" y="92" font-size="10" fill="#a1a1aa">เนื้อหา description ของการ์ดที่</text>
      <text x="14" y="106" font-size="10" fill="#a1a1aa">เห็นในสถานะ default</text>
    </g>

    <!-- Card 2 (hover) -->
    <g transform="translate(258 134)">
      <rect x="0" y="0" width="240" height="160" rx="14" fill="url(#cardA-hover)" stroke="#22d3ee" stroke-width="1.5"/>
      <defs>
        <radialGradient id="cardA-hover" cx="80%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
        </radialGradient>
      </defs>
      <!-- Brackets -->
      <path d="M 222 8 L 232 8 M 232 8 L 232 18" stroke="#22d3ee" stroke-width="2" fill="none"/>
      <path d="M 8 152 L 18 152 M 8 152 L 8 142" stroke="#22d3ee" stroke-width="2" fill="none"/>
      <!-- Scan line -->
      <line x1="0" y1="40" x2="240" y2="40" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
      <text x="14" y="30" font-family="ui-monospace, monospace" font-size="36" font-weight="900" fill="#22d3ee" letter-spacing="-1">02</text>
      <text x="62" y="22" font-family="ui-monospace, monospace" font-size="7" fill="#22d3ee" letter-spacing="1.5">NYXEL // CARD</text>
      <text x="14" y="58" font-size="13" font-weight="700" fill="#f4f4f5">Hover state</text>
      <line x1="14" y1="68" x2="74" y2="68" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="14" y="92" font-size="10" fill="#d4d4d8">brackets ปรากฏ + scan line</text>
      <text x="14" y="106" font-size="10" fill="#d4d4d8">+ border cyan + divider ยาว</text>
    </g>

    <text x="0" y="320" font-size="10" fill="#71717a">✓ matches NYXEL hex chip · ✓ dev/IT vibe · ✓ "เท่ๆ ดุดัน"</text>
    <text x="0" y="336" font-size="10" fill="#71717a">⚠ index/sub-label อาจรู้สึก "เยอะ" สำหรับหน้า warranty/contact</text>
  </g>

  <!-- ==================== B · Soft Premium ==================== -->
  <g transform="translate(440 110)">
    <text x="0" y="-12" font-size="14" font-weight="800" fill="#22d3ee">B · SOFT PREMIUM</text>
    <text x="0" y="6" font-size="10" fill="#a1a1aa">Apple/Linear · clean · restrained</text>

    <!-- Card 1 (default) -->
    <g transform="translate(0 24)">
      <rect x="0" y="0" width="240" height="160" rx="20" fill="#121212" stroke="#27272a" stroke-width="0.5"/>
      <circle cx="32" cy="36" r="16" fill="#22d3ee" opacity="0.1"/>
      <circle cx="32" cy="36" r="3" fill="#22d3ee"/>
      <text x="60" y="42" font-size="14" font-weight="700" fill="#f4f4f5">Header text</text>
      <text x="14" y="80" font-size="10" fill="#a1a1aa">เนื้อหา description คลีน อ่านง่าย</text>
      <text x="14" y="96" font-size="10" fill="#a1a1aa">ไม่มี border accent ใน default</text>
      <text x="14" y="138" font-size="10" font-weight="600" fill="#22d3ee">เรียนรู้เพิ่ม →</text>
    </g>

    <!-- Card 2 (hover) -->
    <g transform="translate(258 134)">
      <rect x="0" y="0" width="240" height="160" rx="20" fill="#161616" stroke="#3f3f46" stroke-width="0.5" filter="url(#soft-shadow)"/>
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
          <feFlood flood-color="#22d3ee" flood-opacity="0.15"/>
          <feComposite in2="SourceAlpha" operator="in"/>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="32" cy="36" r="16" fill="#22d3ee" opacity="0.2"/>
      <circle cx="32" cy="36" r="3" fill="#22d3ee"/>
      <text x="60" y="42" font-size="14" font-weight="700" fill="#f4f4f5">Hover state</text>
      <text x="14" y="80" font-size="10" fill="#d4d4d8">ยกตัวขึ้น + soft cyan glow</text>
      <text x="14" y="96" font-size="10" fill="#d4d4d8">ไม่มี border color change</text>
      <text x="14" y="138" font-size="10" font-weight="600" fill="#22d3ee">เรียนรู้เพิ่ม →</text>
    </g>

    <text x="0" y="320" font-size="10" fill="#71717a">✓ คลีน อ่านง่ายสุด · ✓ universal · ✓ load เร็ว (น้อยที่สุด)</text>
    <text x="0" y="336" font-size="10" fill="#71717a">⚠ อาจดู "เรียบเฉย" ไม่ดุดัน · ขัดกับ FAQ ที่เพิ่งทำ</text>
  </g>

  <!-- ==================== C · Neon Glass ==================== -->
  <g transform="translate(840 110)">
    <text x="0" y="-12" font-size="14" font-weight="800" fill="#22d3ee">C · NEON GLASS</text>
    <text x="0" y="6" font-size="10" fill="#a1a1aa">glass morphism · gradient border</text>

    <!-- Card 1 (default) -->
    <g transform="translate(0 24)">
      <defs>
        <linearGradient id="card-c-border" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
          <stop offset="50%" stop-color="#0891b2" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.5"/>
        </linearGradient>
        <linearGradient id="card-c-top" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="240" height="160" rx="16" fill="rgba(255,255,255,0.04)" stroke="url(#card-c-border)" stroke-width="1"/>
      <rect x="0" y="0" width="240" height="40" rx="16" fill="url(#card-c-top)"/>
      <circle cx="30" cy="30" r="10" fill="rgba(34,211,238,0.2)" stroke="#22d3ee" stroke-width="1"/>
      <text x="52" y="35" font-size="13" font-weight="700" fill="#f4f4f5">Header text</text>
      <text x="14" y="72" font-size="10" fill="#a1a1aa">เนื้อหา description บน glass</text>
      <text x="14" y="88" font-size="10" fill="#a1a1aa">backdrop blur effect</text>
      <line x1="14" y1="120" x2="226" y2="120" stroke="#22d3ee" stroke-width="0.3" opacity="0.3"/>
      <text x="14" y="142" font-size="10" font-weight="600" fill="#22d3ee">→</text>
    </g>

    <!-- Card 2 (hover) -->
    <g transform="translate(0 308)">
      <rect x="0" y="0" width="240" height="160" rx="16" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="1.5" filter="url(#neon-glow)"/>
      <defs>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feFlood flood-color="#22d3ee" flood-opacity="0.4"/>
          <feComposite in2="blur" operator="in"/>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect x="0" y="0" width="240" height="40" rx="16" fill="url(#card-c-top)" opacity="2"/>
      <circle cx="30" cy="30" r="10" fill="rgba(34,211,238,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="52" y="35" font-size="13" font-weight="700" fill="#f4f4f5">Hover state</text>
      <text x="14" y="72" font-size="10" fill="#d4d4d8">border + glow เข้มขึ้น</text>
      <text x="14" y="88" font-size="10" fill="#d4d4d8">backdrop blur + neon outline</text>
      <line x1="14" y1="120" x2="226" y2="120" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
      <text x="14" y="142" font-size="10" font-weight="700" fill="#22d3ee">→</text>
    </g>

    <text x="0" y="500" font-size="10" fill="#71717a">✓ luxury feel · ✓ premium tech vibe</text>
    <text x="0" y="516" font-size="10" fill="#71717a">⚠ backdrop-blur = perf cost · ⚠ ขัดกับ FAQ ที่เป็น solid</text>
  </g>

  <!-- Bottom comparison row: index sample เปรียบเทียบ readability -->
  <g transform="translate(40 580)">
    <text x="0" y="0" font-size="13" font-weight="800" fill="#22d3ee">// READABILITY · LOADING · CONSISTENCY</text>

    <g transform="translate(0 28)">
      <rect x="0" y="0" width="380" height="180" rx="14" fill="#0a0a0a" stroke="#27272a"/>
      <text x="20" y="32" font-size="11" font-weight="700" fill="#22d3ee">A · CYBER LAB</text>
      <text x="20" y="58" font-size="10" fill="#d4d4d8">อ่านง่าย: ★★★★☆</text>
      <text x="20" y="76" font-size="10" fill="#d4d4d8">โหลดเร็ว: ★★★★★ (CSS only)</text>
      <text x="20" y="94" font-size="10" fill="#d4d4d8">Consistent: ★★★★★ (match FAQ)</text>
      <text x="20" y="118" font-size="9" fill="#a1a1aa">เหมาะ: tech-y pages — homepage</text>
      <text x="20" y="132" font-size="9" fill="#a1a1aa">product, FAQ. ปรับ minimal mode</text>
      <text x="20" y="146" font-size="9" fill="#a1a1aa">ได้ (ซ่อน index, sub-label) เพื่อใช้ใน</text>
      <text x="20" y="160" font-size="9" fill="#a1a1aa">warranty / contact</text>
    </g>

    <g transform="translate(400 28)">
      <rect x="0" y="0" width="380" height="180" rx="14" fill="#0a0a0a" stroke="#27272a"/>
      <text x="20" y="32" font-size="11" font-weight="700" fill="#22d3ee">B · SOFT PREMIUM</text>
      <text x="20" y="58" font-size="10" fill="#d4d4d8">อ่านง่าย: ★★★★★</text>
      <text x="20" y="76" font-size="10" fill="#d4d4d8">โหลดเร็ว: ★★★★★ (CSS only)</text>
      <text x="20" y="94" font-size="10" fill="#d4d4d8">Consistent: ★★★☆☆ (ต้อง redo FAQ)</text>
      <text x="20" y="118" font-size="9" fill="#a1a1aa">เหมาะ: warranty / contact /</text>
      <text x="20" y="132" font-size="9" fill="#a1a1aa">policy pages — แต่ขัด FAQ ที่เพิ่งทำ</text>
      <text x="20" y="146" font-size="9" fill="#a1a1aa">ถ้าเลือกอันนี้ → FAQ ต้องถอย</text>
      <text x="20" y="160" font-size="9" fill="#a1a1aa">brackets/scan-line ออก</text>
    </g>

    <g transform="translate(800 28)">
      <rect x="0" y="0" width="380" height="180" rx="14" fill="#0a0a0a" stroke="#27272a"/>
      <text x="20" y="32" font-size="11" font-weight="700" fill="#22d3ee">C · NEON GLASS</text>
      <text x="20" y="58" font-size="10" fill="#d4d4d8">อ่านง่าย: ★★★☆☆</text>
      <text x="20" y="76" font-size="10" fill="#d4d4d8">โหลดเร็ว: ★★★☆☆ (backdrop-blur)</text>
      <text x="20" y="94" font-size="10" fill="#d4d4d8">Consistent: ★★★★☆</text>
      <text x="20" y="118" font-size="9" fill="#a1a1aa">เหมาะ: hero, premium showcase</text>
      <text x="20" y="132" font-size="9" fill="#a1a1aa">— อาจหนัก mobile + low-end</text>
      <text x="20" y="146" font-size="9" fill="#a1a1aa">backdrop-blur ใช้ GPU ต่อเฟรม</text>
    </g>
  </g>

  <text x="620" y="880" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="700">แนะนำ A (CYBER LAB) — มีโหมด "minimal" (ปิด index/bracket) สำหรับหน้าที่ต้องการสงบกว่า เช่น warranty</text>
</svg>
